<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>工作台 · 还没有模型</title>
<link rel="stylesheet" href="_wb.css"/>
<style></style>
</head>
<body>
<div class="page">
  <aside class="rail">
    <div class="logo">3D</div>
    <a><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20H4z"/></svg>首页</a>
    <a class="on"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>工作室</a>
    <a><svg viewBox="0 0 24 24"><polygon points="8,6 18,12 8,18"/></svg>运行</a>
    <a><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>搜索</a>
    <a><svg viewBox="0 0 24 24"><rect x="6" y="7" width="12" height="12"/><path d="M9 7V5h6v2"/></svg>设备</a>
    <a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>设置</a>
  </aside>
  <div class="col">
    <header class="top">
      <div class="brand">3D-NGX 工作台</div>
      <div class="scene">天骄科技园</div>
      
      <button class="ghost">撤销</button>
      <button class="ghost">重做</button>
      <div class="sp"></div>
      <button class="ghost">模板配置</button>
      <button class="ghost">核对绑定</button>
      <button class="ghost pri">应用对接结果</button>
      <button class="ghost">保存</button>
      <button class="ghost pri">预览运行</button>
      <button class="ghost">发布</button>
    </header>
    <div class="view empty-model">
      <div class="frame"></div>
      <div class="canvas-title">天骄科技园 · 综合态势</div>
      <div class="wing left">
        <div class="card dash">
          <div class="hd"><div class="h">实时负荷</div></div>
          <div class="empty"><div class="msg">还没有绑定设备</div><div class="sub">应用对接结果后会在这里显示读数</div></div>
        </div>
        <div class="card dash">
          <div class="hd"><div class="h">设备状态</div></div>
          <div class="empty"><div class="msg">还没有绑定设备</div><div class="sub">应用对接结果后会在这里显示读数</div></div>
        </div>
      </div>
      <div class="wing right">
        <div class="card dash">
          <div class="hd"><div class="h">运行台数</div></div>
          <div class="empty"><div class="msg">还没有绑定设备</div><div class="sub">应用对接结果后会在这里显示读数</div></div>
        </div>
        <div class="card dash">
          <div class="hd"><div class="h">用能趋势</div></div>
          <div class="empty"><div class="msg">还没有绑定设备</div><div class="sub">应用对接结果后会在这里显示读数</div></div>
        </div>
      </div>      <div class="no-model">
        <div class="msg">还没有模型</div>
        <div class="sub">创建时可以先不挂模型。周围卡片可以留着，三维等导入后再跟模型走。</div>
        <div class="btns">
          <button class="btn-pri">导入模型</button>
          <button class="ghost pri">导入示例</button>
        </div>
      </div>

      <div class="drawer"><div class="handle"></div></div>
      <button class="fab">总览</button>

      <div class="statusbar">
        <span>模板「综合态势」· 还没有三维模型 · 本地和平台都没有模型</span>
        <span>工作台 · --ngx-*</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
